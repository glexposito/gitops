# Sized for what charts/worker actually runs today: 1 replica at
# 50m/64Mi requests, 100m/128Mi limits (values.yaml + values-dev.yaml).
# Headroom for a rolling update (2 pods briefly), not per-worker ceilings
# like the original repo's tiered quotas - revisit once more than one
# worker variant/stage exists here.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-workers-quota
  namespace: core-workers
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: 400m
    limits.memory: 512Mi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: core-workers
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: core-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
