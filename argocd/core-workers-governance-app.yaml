# Namespace + quota/limits/network policy for core-workers - kept as a
# separate Application from worker-app.yaml (governance vs workload),
# same split as the original repo's clusters-appset.yaml vs
# core-workers-appset.yaml. Syncs first in practice since it's the
# smaller/faster Application; worker-app.yaml's selfHeal will retry and
# succeed once this has created the namespace, if the two ever race on a
# first-ever apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-workers-governance
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/glexposito/gitops.git
    targetRevision: HEAD
    path: workloads/core-workers
  destination:
    name: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
