# Per-cluster governance manifests (namespaces, quotas, network
# policies) for the apps cluster. Kept separate from worker/hello-world
# (governance vs workload), same split as the original repo's
# clusters-appset.yaml vs core-workers-appset.yaml. Syncs first in
# practice since it's the smaller/faster Application; the workload
# Applications' selfHeal retries and succeeds once this has created the
# namespace, if they ever race on a first-ever apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-cluster-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/glexposito/gitops.git
    targetRevision: HEAD
    path: manifests/apps
  destination:
    name: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
