# Second app, purely to simulate adding one and prove the GitOps pipe
# works - own chart (charts/hello-world), own throwaway namespace with
# no governance layer of its own (CreateNamespace=true here instead).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/glexposito/gitops.git
    targetRevision: HEAD
    path: charts/hello-world
    helm:
      releaseName: hello-world
  destination:
    name: apps
    namespace: hello-world
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
